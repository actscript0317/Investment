<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래내역 - 주식 트레이딩 시스템</title>
    <link rel="stylesheet" href="/css/output.css">
    <style>
        .timeline-container {
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
        }

        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, #3b82f6, #6366f1);
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .date-marker {
            position: relative;
            margin: 40px 0;
        }

        .date-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            background: linear-gradient(to right, transparent, #e5e7eb 20%, #e5e7eb 80%, transparent);
        }

        .date-badge {
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px 24px;
            border-radius: 20px;
            border: 2px solid #3b82f6;
            font-weight: bold;
            color: #3b82f6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .transaction-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 20px;
            position: relative;
        }

        .transaction-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .transaction-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .loss-card {
            border-left: 4px solid #3b82f6;
        }

        .profit-card {
            border-left: 4px solid #ef4444;
        }

        .buy-card {
            border-left: 4px solid #10b981;
        }

        .loss-section {
            text-align: right;
        }

        .profit-section {
            text-align: left;
        }

        .transaction-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .loss-icon {
            right: -40px;
            background: #3b82f6;
            color: white;
        }

        .profit-icon {
            left: -40px;
            background: #ef4444;
            color: white;
        }

        .buy-icon {
            left: -40px;
            background: #10b981;
            color: white;
        }

        .empty-slot {
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .transaction-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .timeline-line {
                left: 20px;
            }

            .loss-section,
            .profit-section {
                text-align: left;
            }

            .transaction-card {
                max-width: 100%;
            }

            .transaction-icon {
                left: -30px !important;
                right: auto !important;
            }
        }
    </style>
</head>

<body class="bg-dark-bg text-text-main pb-24">
    <!-- Main Content -->
    <main class="max-w-md mx-auto px-5 pt-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-text-main tracking-tight">거래내역</h1>
            <div class="w-8 h-8 rounded-full bg-dark-card border border-gray-800 flex items-center justify-center">
                <span class="text-lg">📝</span>
            </div>
        </header>

        <!-- Summary Stats -->
        <div class="glass-card p-5 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-text-sub uppercase tracking-wider">거래 요약</h2>
                <button id="toggleHistory" class="text-xs text-brand-blue hover:text-cyan-300 flex items-center gap-1">
                    <span id="toggleText">접기</span>
                    <span id="toggleIcon">▼</span>
                </button>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-dark-bg rounded-lg p-3 border border-gray-800">
                    <div class="text-xs text-text-sub mb-1">총 거래</div>
                    <div class="text-lg font-bold text-text-main" id="totalTrades">-</div>
                </div>
                <div class="bg-dark-bg rounded-lg p-3 border border-gray-800">
                    <div class="text-xs text-text-sub mb-1">익절</div>
                    <div class="text-lg font-bold text-neon-up" id="profitTrades">-</div>
                </div>
                <div class="bg-dark-bg rounded-lg p-3 border border-gray-800">
                    <div class="text-xs text-text-sub mb-1">손절</div>
                    <div class="text-lg font-bold text-neon-down" id="lossTrades">-</div>
                </div>
            </div>

            <!-- Filter Controls -->
            <div class="mt-4 pt-4 border-t border-gray-800">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 flex-1">
                        <input type="date" id="startDate"
                            class="bg-dark-bg border border-gray-700 text-text-main text-xs rounded-lg px-2 py-2 w-full focus:outline-none focus:border-brand-gold">
                        <span class="text-text-sub">~</span>
                        <input type="date" id="endDate"
                            class="bg-dark-bg border border-gray-700 text-text-main text-xs rounded-lg px-2 py-2 w-full focus:outline-none focus:border-brand-gold">
                    </div>
                    <button id="filterBtn"
                        class="bg-brand-blue text-dark-bg font-bold px-4 py-2 rounded-lg text-xs hover:bg-cyan-400 transition-colors">
                        조회
                    </button>
                </div>
            </div>
        </div>

        <!-- Timeline Container -->
        <div class="timeline-container relative pl-4" id="timelineContainer">
            <div class="timeline-line absolute left-4 top-0 bottom-0 w-0.5 bg-gray-800"></div>

            <!-- Loading State -->
            <div id="loadingState" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-brand-gold"></div>
                <p class="mt-4 text-xs text-text-sub">내역을 불러오는 중...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <div class="text-4xl mb-3 opacity-30">📊</div>
                <p class="text-sm text-text-sub">거래내역이 없습니다</p>
            </div>

            <!-- Transactions List -->
            <div id="transactionsList" class="space-y-6 relative z-10">
                <!-- Transactions will be inserted here via JS -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation (Sticky) -->
    <nav class="fixed bottom-0 left-0 w-full bg-dark-card border-t border-gray-800 pb-safe pt-2 px-6 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto h-16">
            <a href="/home.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                <span class="text-[10px] font-medium">홈</span>
            </a>
            <a href="/chart.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
                </svg>
                <span class="text-[10px] font-medium">차트</span>
            </a>
            <a href="/history.html" class="nav-item active flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="text-[10px] font-medium">내역</span>
            </a>
            <a href="/returns.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                    </path>
                </svg>
                <span class="text-[10px] font-medium">수익</span>
            </a>
            <a href="/account.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span class="text-[10px] font-medium">계좌</span>
            </a>
        </div>
    </nav>

    <script type="module" src="/js/history.js"></script>
</body>

</html>
