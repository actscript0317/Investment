<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 차트 - 주식 트레이딩 시스템</title>
    <link rel="stylesheet" href="/css/output.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://unpkg.com/chartjs-chart-financial"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>
</head>

<body class="bg-dark-bg text-text-main pb-24">
    <!-- Main Content -->
    <main class="max-w-md mx-auto px-5 pt-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-text-main tracking-tight">차트 분석</h1>
            <div class="w-8 h-8 rounded-full bg-dark-card border border-gray-800 flex items-center justify-center">
                <span class="text-lg">📈</span>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="mb-6 relative z-20">
            <div class="relative">
                <input type="text" id="stockSearch" placeholder="종목명 또는 종목코드 검색" class="input-field pl-10">
                <div class="absolute left-3 top-3.5 text-gray-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <div id="searchResults"
                    class="absolute z-30 w-full mt-2 bg-dark-card border border-gray-700 rounded-xl shadow-xl hidden overflow-hidden">
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="glass-card p-4 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 id="chartTitle" class="text-lg font-bold text-text-main truncate pr-2">종목을 선택해주세요</h2>
                <div class="flex space-x-1">
                    <button class="period-btn px-2 py-1 text-xs rounded-lg bg-brand-gold text-dark-bg font-bold"
                        data-period="D">일</button>
                    <button
                        class="period-btn px-2 py-1 text-xs rounded-lg bg-dark-bg text-text-sub hover:text-text-main"
                        data-period="W">주</button>
                    <button
                        class="period-btn px-2 py-1 text-xs rounded-lg bg-dark-bg text-text-sub hover:text-text-main"
                        data-period="M">월</button>
                </div>
            </div>

            <div class="relative w-full h-[400px] bg-dark-bg rounded-xl border border-gray-800 overflow-hidden">
                <canvas id="stockChart"></canvas>
            </div>

            <div class="flex items-center justify-between mt-3">
                <div class="flex space-x-1 overflow-x-auto no-scrollbar">
                    <button
                        class="range-btn px-2 py-1 text-[10px] rounded-md bg-dark-bg text-text-sub border border-gray-800"
                        data-days="30">1개월</button>
                    <button
                        class="range-btn px-2 py-1 text-[10px] rounded-md bg-dark-bg text-text-sub border border-gray-800"
                        data-days="90">3개월</button>
                    <button class="range-btn px-2 py-1 text-[10px] rounded-md bg-brand-blue text-dark-bg font-bold"
                        data-days="365">1년</button>
                </div>
                <button id="resetZoom" class="px-2 py-1 text-[10px] text-text-sub hover:text-text-main">
                    ↺ 초기화
                </button>
            </div>
        </div>

        <!-- Trading Info & Price Levels -->
        <div class="space-y-6">
            <!-- Trading Info -->
            <div class="glass-card p-5">
                <h3 class="text-sm font-bold text-text-sub mb-3 uppercase tracking-wider">매매 정보</h3>
                <div id="tradingInfo" class="space-y-4">
                    <div class="text-center text-text-sub py-4 text-sm">
                        종목을 선택하면<br>정보가 표시됩니다
                    </div>
                </div>
            </div>

            <!-- Price Settings -->
            <div class="glass-card p-5">
                <h3 class="text-sm font-bold text-text-sub mb-3 uppercase tracking-wider">가격 설정</h3>
                <div id="priceLevels" class="space-y-3">
                    <div class="text-center text-text-sub py-4 text-sm">
                        종목을 선택하면<br>가격을 설정할 수 있습니다
                    </div>
                </div>
            </div>

            <!-- Saved Levels List -->
            <div id="priceLevelsCards" class="pb-4">
                <h3 class="text-sm font-bold text-text-sub mb-3 uppercase tracking-wider">설정된 종목</h3>
                <div id="priceLevelsCardsContainer" class="space-y-3">
                    <!-- Cards will be inserted here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation (Sticky) -->
    <nav class="fixed bottom-0 left-0 w-full bg-dark-card border-t border-gray-800 pb-safe pt-2 px-6 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto h-16">
            <a href="/home.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                <span class="text-[10px] font-medium">홈</span>
            </a>
            <a href="/chart.html" class="nav-item active flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
                </svg>
                <span class="text-[10px] font-medium">차트</span>
            </a>
            <a href="/history.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="text-[10px] font-medium">내역</span>
            </a>
            <a href="/returns.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                    </path>
                </svg>
                <span class="text-[10px] font-medium">수익</span>
            </a>
            <a href="/account.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span class="text-[10px] font-medium">계좌</span>
            </a>
        </div>
    </nav>

    <script type="module" src="/js/chart.js"></script>
</body>

</html>
