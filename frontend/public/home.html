<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투자 프로젝트 </title>
    <link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-dark-bg text-text-main pb-24">
    <!-- Main Content -->
    <main class="max-w-md mx-auto px-5 pt-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-text-main tracking-tight">1억 달성 프로젝트</h1>
                <p class="text-sm text-text-sub mt-1">Financial Freedom Journey</p>
            </div>
            <div class="w-10 h-10 rounded-full bg-dark-card border border-gray-800 flex items-center justify-center shadow-glow">
                <span class="text-xl">💰</span>
            </div>
        </header>

        <!-- Progress Card -->
        <div class="glass-card p-6 mb-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-brand-gold opacity-5 rounded-full blur-3xl -mr-10 -mt-10"></div>
            
            <div class="flex justify-between items-end mb-2">
                <span class="text-sm text-text-sub font-medium">현재 자산</span>
                <span class="text-xs text-brand-gold font-bold bg-brand-gold bg-opacity-10 px-2 py-1 rounded-full" id="achievementRate">0%</span>
            </div>
            <h2 class="text-4xl font-bold text-text-main mb-6 tracking-tight" id="currentAsset">-</h2>

            <!-- Progress Bar -->
            <div class="mb-4">
                <div class="flex justify-between text-xs text-text-sub mb-2">
                    <span>진행률</span>
                    <span class="text-brand-gold" id="progressPercentage">0%</span>
                </div>
                <div class="w-full h-3 bg-gray-800 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-gradient-to-r from-brand-gold to-yellow-200 rounded-full transition-all duration-1000 ease-out relative" style="width: 0%">
                        <div class="absolute right-0 top-0 h-full w-1 bg-white opacity-50 animate-pulse"></div>
                    </div>
                </div>
                <div class="flex justify-between mt-2 text-xs text-text-sub">
                    <span>0</span>
                    <span>1억</span>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="glass-card p-5">
                <div class="text-xs text-text-sub mb-1">목표까지</div>
                <div class="text-lg font-bold text-brand-blue" id="remainingAmount">-</div>
            </div>
            <div class="glass-card p-5">
                <div class="text-xs text-text-sub mb-1">오늘의 수익</div>
                <div class="text-lg font-bold text-neon-up">+0원</div> <!-- Placeholder, logic handles this elsewhere if available -->
            </div>
        </div>

        <!-- Encouragement Message -->
        <div class="glass-card p-5 border-l-4 border-brand-gold">
            <h3 class="text-sm font-bold text-text-main mb-1">Daily Insight</h3>
            <p class="text-sm text-text-sub leading-relaxed" id="encouragementMessage">
                데이터를 불러오는 중입니다...
            </p>
        </div>
    </main>

    <!-- Bottom Navigation (Sticky) -->
    <nav class="fixed bottom-0 left-0 w-full bg-dark-card border-t border-gray-800 pb-safe pt-2 px-6 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto h-16">
            <a href="/home.html" class="nav-item active flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-medium">홈</span>
            </a>
            <a href="/chart.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                <span class="text-[10px] font-medium">차트</span>
            </a>
            <a href="/history.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[10px] font-medium">내역</span>
            </a>
            <a href="/returns.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-[10px] font-medium">수익</span>
            </a>
            <a href="/account.html" class="nav-item flex flex-col items-center space-y-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium">계좌</span>
            </a>
        </div>
    </nav>

    <script type="module" src="/js/index.js"></script>
</body>
</html>
